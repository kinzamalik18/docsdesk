# Render blueprint for the DocsDesk API.
#
# Reads two environment groups created once in the Render dashboard:
#   gemini    GEMINI_API_KEY
#   supabase  DATABASE_URL (no password in it) and PGPASSWORD
# After the frontend is deployed, set CORS_ORIGINS to its URL.
services:
  - type: web
    name: docsdesk-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: gemini
      - fromGroup: supabase
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_DIM
        value: "768"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: COMPANY_NAME
        value: Fernbill
      - key: MIN_SIMILARITY
        value: "0.45"
